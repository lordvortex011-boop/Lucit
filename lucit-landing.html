<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #F6F3EC;
            font-family: 'Inter', system-ui, sans-serif;
            color: #211D16;
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
        }
        
        .browser {
            width: 1280px;
            max-width: 100%;
            margin: 40px auto;
            background: #111;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(0,0,0,0.6);
            position: relative;
        }
        
        .browser-header {
            height: 48px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 8px;
        }
        
        .browser-dots {
            display: flex;
            gap: 6px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
        }
        
        .browser-content {
            padding: 40px;
            background: #F6F3EC;
            min-height: 100vh;
            position: relative;
        }
        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 80px;
        }
        
        .logo {
            font-family: 'Fraunces', serif;
            font-size: 32px;
            font-weight: 700;
            color: #211D16;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background: #211D16;
            border-radius: 12px;
            margin-right: 12px;
            color: white;
            font-size: 28px;
            font-family: 'Fraunces', serif;
            box-shadow: 0 4px 12px rgba(33, 29, 22, 0.3);
        }
        
        .logo-text {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -1px;
        }
        
        .join-button {
            background: white;
            color: #211D16;
            border: none;
            padding: 12px 28px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }
        
        .join-button:hover {
            background: #F6F3EC;
            transform: translateY(-1px);
        }
        
        .hero {
            text-align: center;
            margin-bottom: 120px;
        }
        
        .hero h1 {
            font-family: 'Fraunces', serif;
            font-size: 92px;
            font-weight: 700;
            line-height: 1.05;
            color: #211D16;
            letter-spacing: -4px;
            margin-bottom: 24px;
            text-transform: none;
        }
        
        .waitlist-section {
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 520px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }
        
        .waitlist-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #211D16;
            opacity: 0.7;
            margin-bottom: 8px;
        }
        
        .waitlist-heading {
            font-family: 'Fraunces', serif;
            font-size: 42px;
            font-weight: 700;
            line-height: 1.1;
            color: #211D16;
            margin-bottom: 32px;
        }
        
        .email-input {
            width: 100%;
            padding: 18px 24px;
            border: 1px solid #e5e5e5;
            border-radius: 9999px;
            font-size: 17px;
            background: #F6F3EC;
            margin-bottom: 16px;
            font-family: 'Inter', sans-serif;
        }
        
        .join-button-waitlist {
            width: 100%;
            background: #211D16;
            color: white;
            border: none;
            padding: 18px 32px;
            border-radius: 9999px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .join-button-waitlist:hover {
            background: #211D16;
            transform: translateY(-2px);
        }
        
        .footer {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
        }
        
        .footer-text {
            font-family: 'Fraunces', serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #211D16;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="browser">
        <div class="browser-header">
            <div class="browser-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div class="browser-content">
            <div class="navbar">
                <div class="logo">
                    <span class="logo-icon">🔥</span>
                    <span class="logo-text">lucit</span>
                </div>
                <button onclick="alert('Would join waitlist')" class="join-button">
                    Join waitlist
                </button>
            </div>
            
            <div class="hero">
                <h1>Turn ideas into output.</h1>
            </div>
            
            <div class="waitlist-section">
                <div class="waitlist-label">WAITLIST</div>
                <h2>Join the waitlist</h2>
                
                <input type="email" class="email-input" placeholder="Enter your email">
                
                <button class="join-button-waitlist">Join the waitlist</button>
            </div>
            
            <div class="footer">
                <div class="footer-text">LUCIT</div>
            </div>
        </div>
    </div>
</body>
</html>
```
